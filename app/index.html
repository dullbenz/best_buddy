<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d12" />
    <title>Buddy, the best dog in the world.</title>
    <meta
      name="description"
      content="The Buddy community relaunch on Solana. An immutable contract, a burned upgrade authority, a reproducible snapshot, and one rule: whatever goes unclaimed becomes community staking rewards. Every claim on this site is checkable in under a minute."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Buddy" />
    <meta
      property="og:title"
      content="Buddy, the best dog in the world."
    />
    <meta
      property="og:description"
      content="Immutable program, burned upgrade authority, the team's tokens locked in a stream, and a snapshot anyone can rebuild from public chain data. Four buckets, one rule."
    />
    <meta property="og:url" content="https://mybestbuddy.fun/" />
    <meta property="og:image" content="https://mybestbuddy.fun/badge-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />

    <!-- `summary`, not `summary_large_image`. The mark is square, and the large
         card crops to 2:1 — which would slice the top and bottom off the badge,
         wordmark included. Switch to the large card once there is a proper
         1200x630 banner to put in it. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://mybestbuddy.fun/badge-512.png" />

    <!-- Two marks, deliberately. `badge` is the full scene and is only ever
         shown large; `mark` is the dog's head alone, because a boy and a dog
         cheek to cheek turn to mush below about 64px. Nothing here is a
         downscale of the badge. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/mark-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/mark-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
