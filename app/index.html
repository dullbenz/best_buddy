<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d12" />
    <title>Buddy — you don't have to trust us, you can check</title>
    <meta
      name="description"
      content="The Buddy community relaunch on Solana. An immutable contract, a burned upgrade authority, a reproducible snapshot, and one rule: whatever goes unclaimed becomes community staking rewards. Every claim on this site is checkable in under a minute."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Buddy" />

      property="og:title"

      property="og:description"
      content="Immutable program, burned upgrade authority, Token Creator's tokens locked in a stream, and a snapshot anyone can rebuild from public chain data. Four buckets, one rule."

    <meta property="og:image:height" content="512" />

    <!-- `summary`, not `summary_large_image`. The mark is square, and the large
         card crops to 2:1 — which would slice the top and bottom off the badge,
         wordmark included. Switch to the large card once there is a proper
         1200x630 banner to put in it. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://mybestbuddy.fun/icon-512.png" />

    <!-- 32 and 16 are generated from the full badge for now. Both faces turn to
         mush at that size, so they should be regenerated from a dog-head crop
         once one exists — see app/public/README.md. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
