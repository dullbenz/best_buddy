name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_VERSION: stable
  ANCHOR_VERSION: 0.31.1

jobs:
  # Cheap, fast checks that should fail the build before anything expensive runs.
  guard:
    name: Safety checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A leaked program keypair means someone else can replace the deployed
      # contract. A leaked authority keypair means they can drain the buckets
      # before the config lock. Neither should ever reach the repo.
      - name: Refuse to build if a keypair was committed
        run: |
          if git ls-files | grep -E '(keypair|id\.json$|.*-key\.json$)' ; then
            echo "::error::A keypair file is tracked by git. Remove it and rotate the key."
            exit 1
          fi
          echo "No keypair files tracked."

      - name: Refuse to build if a placeholder reached a deploying branch
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        run: |
          if grep -q "REPLACE_WITH_YOUR" .firebaserc ; then
            echo "::error::.firebaserc still holds placeholders. Set the project id and both hosting site ids."
            exit 1
          fi

  program:
    name: Program build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cache Rust and Solana toolchains
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.avm
            ~/.local/share/solana
            ~/.cache/solana
            target
          key: ${{ runner.os }}-toolchain-${{ env.ANCHOR_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-toolchain-${{ env.ANCHOR_VERSION }}-

      - name: Install Solana
        run: |
          if [ ! -x "$HOME/.local/share/solana/install/active_release/bin/solana" ]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor
        run: |
          if [ ! -x "$HOME/.avm/bin/anchor-${ANCHOR_VERSION}" ]; then
            cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
            avm install "${ANCHOR_VERSION}"
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # avm's `anchor` shim re-pins Solana to the version it prefers (2.1.0),
      # whose bundled cargo cannot parse edition-2024 crates in our dependency
      # tree. Reset to stable and call the Anchor binary directly instead.
      - name: Pin Solana back to stable
        run: |
          agave-install init "${SOLANA_VERSION}"
          solana --version
          cargo-build-sbf --version

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Typecheck scripts and tests
        run: npx tsc --noEmit -p tsconfig.json

      - name: Rust unit tests
        run: cargo test -p buddy-distributor --lib

      - name: Build program
        run: ~/.avm/bin/anchor-${ANCHOR_VERSION} build

      # The app builds against the IDL committed at idl/ so deploys stay fast.
      # If a program change lands without regenerating it, the site would ship
      # an interface that no longer matches the chain, so catch that here.
      - name: Verify the committed IDL is current
        run: |
          if ! diff -q target/idl/buddy_distributor.json idl/buddy_distributor.json > /dev/null; then
            echo "::error::idl/buddy_distributor.json is stale. Run 'anchor build' and commit target/idl/buddy_distributor.json to idl/."
            diff target/idl/buddy_distributor.json idl/buddy_distributor.json || true
            exit 1
          fi
          echo "Committed IDL matches the build."

      - name: Integration tests
        run: npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts

      - name: Upload program artifact
        uses: actions/upload-artifact@v7
        with:
          name: program
          path: |
            target/deploy/buddy_distributor.so
            target/idl/buddy_distributor.json
          retention-days: 30

  app:
    name: App build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          cd app && npm install --legacy-peer-deps

      - name: Typecheck and build
        working-directory: app
        env:
          VITE_RPC_URL: ${{ vars.VITE_RPC_URL || 'https://api.mainnet-beta.solana.com' }}
          VITE_PROGRAM_ID: ${{ vars.VITE_PROGRAM_ID || '6gXQUJ8WQWZjhvNWPqDNMYk185hQyZyn3yTEAwkx6qHM' }}
        run: npm run build

      - name: Check the published proofs are valid JSON
        run: |
          for f in app/public/proofs/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" \
              || { echo "::error::$f is not valid JSON"; exit 1; }
          done
          echo "Proof files parse cleanly."

  gamehub:
    name: Game hub build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          (cd gamehub && npm install --legacy-peer-deps)
          (cd functions-gamehub && npm install)

      - name: Sync the shared game core
        run: node scripts/gamehub-sync.mjs

      # The client and the server run the same simulations. If a change moves a
      # fixture, rounds already issued to players would replay to a different
      # score than the one they watched.
      - name: Simulation fixtures
        run: node --test "game-core/test/**/*.test.js"

      - name: Typecheck and build
        working-directory: gamehub
        env:
          VITE_CLUSTER: devnet
          VITE_RPC_URL: https://api.devnet.solana.com
          VITE_PROGRAM_ID: ${{ vars.DEVNET_PROGRAM_ID || '5rqxrosd3X6cqc9u7e4gjZHadUCroyFJZiVDTcwTsynp' }}
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_PROJECT_ID: demo-gamehub
        run: npm run build

      # Belt and braces on top of the production deploy's own check: a build
      # without the flag must never contain the test wallet.
      - name: The test wallet must not survive a default build
        run: |
          if grep -rl "TEST_WALLET_ADAPTER" gamehub/dist/ 2>/dev/null; then
            echo "::error::The end-to-end test wallet leaked into a build made without VITE_ENABLE_TEST_WALLET."
            exit 1
          fi
          echo "clean"

  gamehub-e2e:
    name: Game hub end-to-end (emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          (cd gamehub && npm install --legacy-peer-deps)
          (cd functions-gamehub && npm install)

      - name: Sync the shared game core
        run: node scripts/gamehub-sync.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: gamehub

      # Emulator-only values. The demo- project id keeps the emulators from
      # reaching for any real Google service.
      - name: Write emulator environment
        run: |
          {
            echo "GAMEHUB_SERVER_RPC_URL=https://api.devnet.solana.com"
            echo "GAMEHUB_PROGRAM_ID=5rqxrosd3X6cqc9u7e4gjZHadUCroyFJZiVDTcwTsynp"
            echo "GAMEHUB_ADMIN_WALLETS="
            echo "GAMEHUB_TEST_KEY=ci-test-key"
            echo "COMMIT_SHA=${{ github.sha }}"
            echo "GAMEHUB_STAKE_STUB=*"
            echo "STAGING_USER=buddy"
            echo "STAGING_PASSWORD=ci"
          } > functions-gamehub/.env.local
          {
            echo "VITE_CLUSTER=devnet"
            echo "VITE_RPC_URL=https://api.devnet.solana.com"
            echo "VITE_LOCAL_RPC_URL=https://api.devnet.solana.com"
            echo "VITE_PROGRAM_ID=5rqxrosd3X6cqc9u7e4gjZHadUCroyFJZiVDTcwTsynp"
            echo "VITE_FIREBASE_API_KEY=fake-api-key"
            echo "VITE_FIREBASE_PROJECT_ID=demo-gamehub"
            echo "VITE_ENABLE_TEST_WALLET=true"
          } > gamehub/.env.local

      # Both suites share one emulator start: the API tests drive the functions
      # over HTTP, and the browser suite drives the app that calls them.
      - name: Run the API and browser suites against the emulators
        env:
          GAMEHUB_TEST_KEY: ci-test-key
        run: |
          npx --yes firebase-tools@13 emulators:exec \
            --only auth,functions,firestore --project demo-gamehub \
            "npm --prefix functions-gamehub test && npm --prefix gamehub run e2e:local"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gamehub-e2e-local-report
          path: gamehub/playwright-report/
          retention-days: 7
