# Dependency updates.
#
# Weekly rather than daily, and grouped, because this repository's dependency
# churn is not the interesting risk: the on-chain program is immutable and its
# dependencies are frozen into bytecode that can never be rebuilt into the
# deployed contract. What these updates actually protect is the *site* and the
# tooling — the parts a visitor's browser runs and the parts that sign
# transactions — so those are what is watched here.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      app-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # No cargo entry, deliberately.
  #
  # The program's Rust dependencies are frozen into bytecode that is already
  # deployed and can never be rebuilt into the running contract — its upgrade
  # authority is burned. Bumping them cannot improve what is on mainnet, and it
  # would break `solana-verify verify-from-repo`, which rebuilds this source and
  # compares the hash to the deployed program. That check is the whole point of
  # publishing the source, so the dependency tree stays exactly as it was built.
  #
  # Cargo advisories against the deployed program are therefore reported, not
  # patched: see SECURITY.md. Watching them still has value — the community
  # deserves to know — but the response is disclosure and mitigation, never a
  # version bump. Dependabot alerts remain enabled repo-wide for that.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
