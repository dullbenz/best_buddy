[package]
name = "buddy-distributor"
version = "0.1.0"
description = "Four-bucket community distributor for the Buddy relaunch"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "buddy_distributor"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Devnet test builds ONLY: shrinks every wall-clock duration to minutes so the
# end-to-end campaign can watch windows expire, locks mature and streams vest in
# one sitting. Never a default; never in a mainnet build. solana-verify builds
# default features, so the deployed mainnet bytecode provably excludes it.
fast-clock = []

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"

# Anchor's `#[program]` and `#[derive(Accounts)]` macros expand to code guarded
# by cfgs that belong to anchor-lang, not to this crate — so cargo's check-cfg
# lint flags every one of them as unknown. Declaring them as expected is the
# supported fix; it silences the noise without disabling the lint, so a genuine
# typo in one of our own cfgs would still be caught.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("anchor-debug"))',
    'cfg(feature, values("custom-heap"))',
    'cfg(feature, values("custom-panic"))',
    'cfg(target_os, values("solana"))',
] }
